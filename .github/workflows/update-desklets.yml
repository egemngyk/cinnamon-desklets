
name: Update Desklets Registry

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-desklets-registry
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan repositories and update README
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_READ_TOKEN || github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_registry.py

      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update desklets registry"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Successfully pushed registry update."
              exit 0
            fi

            echo "Push failed. Retrying ($attempt/5)..."
            sleep 3
          done

          echo "Failed to push after 5 attempts."
          exit 1
