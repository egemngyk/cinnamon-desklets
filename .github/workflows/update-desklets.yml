
name: Update Desklets Registry

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan repositories and update README
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_READ_TOKEN || github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from urllib.parse import quote

          OWNER = os.environ["GITHUB_OWNER"]
          CURRENT_REPO = os.environ["CURRENT_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          API = "https://api.github.com"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Cinnamon-Desklets-Registry"
          }

          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"

          def get_json(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          def get_text(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8")

          # Determine whether the owner is a user or an organization.
          owner_info = get_json(f"{API}/users/{OWNER}")

          if owner_info.get("type") == "Organization":
              endpoint = f"{API}/orgs/{OWNER}/repos"
          else:
              endpoint = f"{API}/users/{OWNER}/repos"

          # Fetch all repositories, including newly created ones.
          repositories = []
          page = 1

          while True:
              batch = get_json(
                  f"{endpoint}?per_page=100&page={page}&sort=full_name"
              )

              if not batch:
                  break

              repositories.extend(batch)
              page += 1

          print(f"Found {len(repositories)} repositories.")

          desklets = []

          for repo in repositories:
              full_name = repo["full_name"]

              if full_name.lower() == CURRENT_REPO.lower():
                  continue

              if repo.get("archived"):
                  continue

              branch = quote(repo["default_branch"], safe="")
              manifest_url = (
                  f"https://raw.githubusercontent.com/"
                  f"{full_name}/{branch}/manifest.json"
              )

              try:
                  manifest = json.loads(get_text(manifest_url))

                  name = manifest.get("name")
                  version = manifest.get("version")
                  description = manifest.get("description")

                  if not all(
                      isinstance(value, str) and value.strip()
                      for value in (name, version, description)
                  ):
                      print(f"Skipping invalid manifest: {full_name}")
                      continue

                  desklets.append({
                      "name": name.strip(),
                      "version": version.strip(),
                      "description": description.strip(),
                      "url": repo["html_url"]
                  })

                  print(f"Found desklet: {name} ({version})")

              except Exception as error:
                  print(f"Skipping {full_name}: {error}")

          # Sort alphabetically.
          desklets.sort(key=lambda item: item["name"].lower())

          # Generate the Projects section.
          if desklets:
              lines = []

              for desklet in desklets:
                  description = re.sub(
                      r"\s+", " ", desklet["description"]
                  ).replace("|", r"\|")

                  lines.extend([
                      f"### [{desklet['name']}]({desklet['url']})",
                      "",
                      f"**Version:** `{desklet['version']}`",
                      "",
                      description,
                      ""
                  ])

              projects_content = "\n".join(lines).strip()
          else:
              projects_content = "No desklets have been published yet."

          # Update only the content between the markers.
          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          pattern = (
              r"(<!-- PROJECTS_LIST_START -->)"
              r".*?"
              r"(<!-- PROJECTS_LIST_END -->)"
          )

          updated_readme, count = re.subn(
              pattern,
              lambda match: (
                  match.group(1)
                  + "\n\n"
                  + projects_content
                  + "\n\n"
                  + match.group(2)
              ),
              readme,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise RuntimeError(
                  "Could not find README project list markers."
              )

          if updated_readme == readme:
              print("README is already up to date.")
          else:
              with open(readme_path, "w", encoding="utf-8") as file:
                  file.write(updated_readme)

              print(f"README updated with {len(desklets)} desklets.")

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update desklets registry"
            git push
          fi
